name: Build Windows installer & release

# Build the frozen Windows GUI and attach the installer to a GitHub Release
# whenever a v* tag is pushed. Also runnable on demand via the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0) for a manual run"
        required: true
        default: "0.0.0"

permissions:
  contents: write  # needed to create the Release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tag objects so we can read the annotated tag's
          # message (used as the release notes / in-app "What's new" box).
          fetch-depth: 0

      - name: Derive version
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Verify __version__ matches the tag
        # Single source of truth: src/flamingo_stitcher/_version.py drives the
        # package version, the installer version, AND the in-app updater's
        # "installed version". A tag whose version segment disagrees with the
        # code would ship an installer that reports itself out of date forever
        # — fail fast instead.
        shell: bash
        run: |
          CODE_V=$(python -c "import re,sys; s=open('src/flamingo_stitcher/_version.py').read(); m=re.search(r'__version__\s*=\s*[\x27\x22]([^\x27\x22]+)', s); sys.stdout.write(m.group(1) if m else '')")
          echo "_version.py __version__ = $CODE_V"
          if [ -z "$CODE_V" ]; then
            echo "::error::Could not parse __version__ from src/flamingo_stitcher/_version.py"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "$CODE_V" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag version (${{ steps.ver.outputs.version }}) != __version__ ($CODE_V). Bump them in lockstep."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # GUI + direct-Imaris output. (napari intentionally NOT installed.)
          pip install ".[gui,imaris]"
          # Destriping backend (installed --no-deps to avoid resolver backtracking
          # from pystripe's ancient exact pins). Essential on the ASLM scope, and
          # destripe_volume() now hard-errors if it is absent, so a failed install
          # must FAIL the release rather than silently ship a build that cannot
          # destripe.
          pip install "pystripe==1.3.1" --no-deps
          # pystripe.core imports these at module top level, so `import pystripe`
          # (and thus the GUI's availability probe) fails without them. numpy /
          # scipy / scikit-image / tifffile / pywt / imageio already come from the
          # modern stack above; dcimg (Hamamatsu format) and tqdm do NOT — install
          # them at compatible versions (NOT pystripe's ancient pins).
          pip install dcimg tqdm
          pip install pyinstaller

      - name: Freeze GUI with PyInstaller
        run: pyinstaller --noconfirm installer/flamingo_stitcher.spec

      - name: Sanity-check the frozen bundle exists
        shell: bash
        run: test -f dist/FlamingoStitcher/FlamingoStitcher.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.ver.outputs.version }}
          installer\installer.iss

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlamingoStitcher-Setup-${{ steps.ver.outputs.version }}
          path: installer/Output/*.exe

      - name: Build release notes from the tag message
        # The annotated tag's message body is the curated changelog. It becomes
        # the release notes AND the text the in-app updater shows in its
        # "What's new" box. Falls back to the full tag/commit message if there's
        # no separate body, then to a minimal line so the notes are never empty.
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          # actions/checkout on a tag push leaves a LIGHTWEIGHT tag locally, so
          # %(contents:body) would read the tagged COMMIT's message (including
          # its "Claude-Session:" trailer) instead of the curated annotated-tag
          # notes. Re-fetch the real tag object so we read the tag, not the
          # commit.
          git fetch --force origin \
            "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" || true

          BODY=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents:body)')
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY=$(git for-each-ref "refs/tags/${GITHUB_REF_NAME}" --format='%(contents)')
          fi
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="Flamingo Stitcher ${{ steps.ver.outputs.version }}"
          fi
          # Belt-and-suspenders: strip commit trailers that must never surface in
          # user-facing release notes, even if a commit message leaks through.
          BODY=$(printf '%s\n' "$BODY" | grep -v -E '^(Claude-Session|Co-authored-by):')
          printf '%s\n' "$BODY" > RELEASE_NOTES.md
          echo "Release notes ($(wc -l < RELEASE_NOTES.md) lines):"
          cat RELEASE_NOTES.md

      - name: Attach installer to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          # Curated tag notes first; GitHub's auto-generated changelog (commit
          # list + compare link) is appended below them.
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
