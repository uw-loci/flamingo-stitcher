# Microscope Hardware Configuration
# Single source of truth for camera, optics, and stage parameters.
# All code that needs sensor dimensions, pixel sizes, or FOV should
# read from this file rather than using local hardcoded constants.
#
# --- IMPORTANT ---
# If you change cameras or objectives, update this file and restart.
# All derived values (effective_pixel_size_um, fov_mm) are computed
# from these base parameters at load time.

camera:
  # Physical sensor pixel size (manufacturer spec, independent of optics)
  sensor_pixel_size_um: 6.5

  # Sensor dimensions in pixels (active area)
  sensor_width_px: 2048
  sensor_height_px: 2048

optics:
  # Nominal objective magnification (engraved on the objective barrel)
  objective_magnification: 16.0

  # Tube lens design focal length in mm.
  # Standard microscope tube lenses are 200mm, but light-sheet systems
  # often use non-standard tube lenses. The Flamingo uses a ~321mm
  # tube lens, giving a system magnification of 16 * (321/200) = 25.68x.
  #
  # Set to 200.0 if your system uses a standard tube lens.
  tube_lens_focal_length_mm: 321.0

  # Reference tube lens focal length (mm) for magnification calculation.
  # System magnification = objective_mag * (tube_lens / reference_tube_lens)
  # For most microscope objectives, this is 200mm.
  reference_tube_lens_mm: 200.0

  # Numerical aperture of the detection objective.
  # Used for deconvolution PSF generation and depth-of-field calculations.
  numerical_aperture: 0.4

  # Refractive index of the immersion medium.
  # Common values: 1.0 (air), 1.33 (water), 1.52 (oil)
  immersion_refractive_index: 1.33

  # Camera X axis is inverted relative to stage X axis.
  # Common in light-sheet systems where the camera sees a mirror image. If True,
  # each tile is flipped in X before stitching. This is the LEGACY default used
  # when a microscope has no "tile_orientation" preset below; leave it as-is for
  # standard single-camera systems.
  camera_x_inverted: true

# Per-microscope PER-TILE orientation, keyed by the "Microscope name" recorded
# in the acquisition's ScopeSettings.txt / FlamingoMetaData.txt (case-
# insensitive). Applied to EACH TILE's pixels before placement, so tiles connect
# — a 90°-rotated camera needs each tile transposed, a mirror needs a flip, etc.
# Rotating the finished mosaic can't fix broken seams; this can. Pick the right
# one with the GUI/CLI orientation preview (the panel where tissue is continuous
# across seams), then set it here so it auto-applies by microscope name.
#
# Value is one of the 8 dihedral orientations (see
# flamingo_stitcher.orientation.MosaicOrientation.NAMES):
#   identity, rot90, rot180, rot270,
#   flip_h, flip_v, transpose, anti_transpose
# (flip_h == the legacy camera_x_inverted: true behaviour.)
#
# Two OPTIONAL flags per scope place tiles in reversed stage order (e.g. X3 X2
# X1 X0 instead of X0 X1 X2 X3) WITHOUT flipping tile pixels — a separate degree
# of freedom from tile_orientation, for a stage axis that runs opposite the
# camera content direction:
#   reverse_x: true / reverse_y: true   (default false)
microscopes:
  # n7 (rig-determined): pixels need no flip, but the X tile ORDER is reversed,
  # so identity + reverse_x. (Was flip_h; corrected on-rig 2026-07.)
  n7:
    tile_orientation: identity
    reverse_x: true

  # ASLM / TSPIM system (objective on the RIGHT, single illumination). The
  # camera is oriented differently — find the tile_orientation (and any
  # reverse_x/reverse_y) where tiles CONNECT using the orientation preview,
  # then set it here.
  #   aslm-25x:
  #     tile_orientation: transpose
  #     reverse_y: true

  # Liara — high-res system (0.7 NA special objective into ethyl cinnamate,
  # 200 mm tube lens, so no extra factor). System magnification measured on a
  # calibration standard (subpixel line-profile) = 25.48× → 6.5 µm / 25.48 ≈
  # 0.2551 µm/px. This supersedes the earlier nominal 23.8× (0.273 µm/px) and
  # the stale 17× that some ScopeSettings.txt files carry. Used only as a
  # fallback when the acquisition's ScopeSettings.txt has no objective; set the
  # server objective to 25.48 so acquisitions record it directly.
  liara:
    objective_magnification: 25.48

# Laser / illumination channels
# Channel wavelengths used as defaults for per-channel deconvolution.
# The first matching channel wavelength is used if no explicit override.
channel_wavelengths_nm:
  0: 405.0    # DAPI
  1: 488.0    # GFP
  2: 561.0    # RFP
  3: 640.0    # Far-Red

# Stage travel limits (mm and degrees)
# These are safety limits — positions outside these ranges are rejected.
# Set conservatively to prevent hardware collisions.
stage_limits:
  x_min_mm: 0.0
  x_max_mm: 26.0
  y_min_mm: 0.0
  y_max_mm: 26.0
  z_min_mm: 0.0
  z_max_mm: 26.0
  r_min_deg: -720.0
  r_max_deg: 720.0
